<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto — Javier Díaz Caballero</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="topbar is-visible">

  <nav class="topbar-left">
    <a href="index.html#audiovisual">Audiovisual</a>
    <a href="index.html#fotografia">Fotografía</a>
  </nav>

  <a href="index.html" class="topbar-name">
    JAVIER DÍAZ CABALLERO
  </a>

  <nav class="topbar-right">
    <a href="contacto.html">Contacto</a>
  </nav>

</header>

<main class="contact-page">

  <section class="contact-section">

    <div class="contact-intro">

      <span class="contact-label">
        CONTACTO
      </span>

      <h1>
        ¿Tienes un proyecto en mente?
      </h1>

      <p>
        Hagamos cine.
      </p>

    </div>

    <form class="contact-form" action="#" method="POST">

      <div class="contact-field">
        <label for="name">Nombre</label>
        <input type="text" id="name" name="name" placeholder="Tu nombre" required>
      </div>

      <div class="contact-field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="Tu email" required>
      </div>

      <div class="contact-field">
        <label for="subject">Asunto</label>
        <input type="text" id="subject" name="subject" placeholder="¿En qué puedo ayudarte?" required>
      </div>

      <div class="contact-field contact-message">
        <label for="message">Mensaje</label>
        <textarea id="message" name="message" placeholder="Cuéntame sobre tu proyecto..." required></textarea>
      </div>

      <button type="submit" class="contact-submit">
        ENVIAR <span>→</span>
      </button>

    </form>

    <div class="contact-socials">

      <a href="https://www.instagram.com/javierdiazcaballero/" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="1.7"/>
          <circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.7"/>
          <circle cx="17.4" cy="6.7" r="1"/>
        </svg>
        <span>Instagram</span>
      </a>

      <a href="https://www.youtube.com/@javierdiazcaballero" target="_blank" rel="noopener noreferrer" aria-label="YouTube">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="2.5" y="5.5" width="19" height="13" rx="4" fill="none" stroke="currentColor" stroke-width="1.7"/>
          <path d="M10 9l5 3-5 3z"/>
        </svg>
        <span>YouTube</span>
      </a>

    </div>

  </section>

</main>

<footer>
  <span>Javier Díaz Caballero</span>
  <a href="index.html">Volver al portfolio ↑</a>
</footer>

</body>
</html>
